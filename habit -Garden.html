<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حديقة العادات</title>
<meta name="description" content="تطبيق ويب بسيط لتتبع عاداتك اليومية — كل عادة بتتحول لنبتة بتكبر كل ما تلتزم بيها">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500;600;700&family=Tajawal:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f0eee2;
    --bg-soft: #e8e4d4;
    --card: #f7f5ea;
    --ink: #23281f;
    --ink-soft: #565c4e;
    --moss: #2f3d2c;
    --sage: #7c9473;
    --sage-light: #a9bd9d;
    --amber: #e0ac3f;
    --clay: #b3654f;
    --line: #d9d4c1;
    --radius: 18px;
    --shadow: 0 10px 30px -14px rgba(35,40,31,0.35);
  }

  *{ box-sizing: border-box; }

  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 85% -10%, #f7f4e6 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 10%, #eef0e2 0%, transparent 55%),
      var(--bg);
    color: var(--ink);
    font-family: 'Tajawal', sans-serif;
    min-height: 100vh;
  }

  .wrap{
    max-width: 1040px;
    margin: 0 auto;
    padding: 48px 24px 90px;
  }

  /* ---------- Header ---------- */
  header.hero{
    display:flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    padding-bottom: 34px;
    margin-bottom: 34px;
    border-bottom: 1px solid var(--line);
  }

  .hero-title{
    font-family: 'Markazi Text', serif;
    font-weight: 700;
    font-size: clamp(2.6rem, 5vw, 3.6rem);
    color: var(--moss);
    margin: 0 0 6px;
    line-height: 1.1;
    display:flex;
    align-items:center;
    gap: 14px;
  }

  .hero-title svg{ width: 46px; height: 46px; flex-shrink:0; }

  .hero-sub{
    margin:0;
    color: var(--ink-soft);
    font-size: 1.05rem;
    max-width: 46ch;
  }

  .hero-stats{
    display:flex;
    gap: 22px;
  }

  .stat{
    text-align:center;
    min-width: 74px;
  }

  .stat b{
    display:block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.7rem;
    color: var(--moss);
  }

  .stat span{
    font-size: .8rem;
    color: var(--ink-soft);
  }

  /* ---------- Add habit ---------- */
  .planter{
    display:flex;
    gap: 12px;
    flex-wrap: wrap;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
    margin-bottom: 40px;
  }

  .planter input[type="text"]{
    flex: 1 1 240px;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 12px;
    padding: 14px 16px;
    font-family: 'Tajawal', sans-serif;
    font-size: 1rem;
    color: var(--ink);
  }

  .planter input[type="text"]:focus-visible,
  button:focus-visible,
  .habit-check:focus-visible{
    outline: 3px solid var(--amber);
    outline-offset: 2px;
  }

  .planter button,
  .empty-cta button{
    border: none;
    background: var(--moss);
    color: #f4f2e6;
    font-family: 'Tajawal', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    padding: 14px 22px;
    border-radius: 12px;
    cursor: pointer;
    display:flex;
    align-items:center;
    gap: 8px;
    transition: transform .15s ease, background .2s ease;
  }

  .planter button:hover, .empty-cta button:hover{ background:#3c4d38; transform: translateY(-1px); }
  .planter button:active{ transform: translateY(0); }

  /* ---------- Garden grid ---------- */
  .garden{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 20px;
  }

  .habit-card{
    position:relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 18px 20px;
    box-shadow: var(--shadow);
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    animation: sprout .5s ease both;
  }

  @keyframes sprout{
    from{ opacity:0; transform: translateY(14px) scale(.96); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }

  .plant-stage{
    width: 120px;
    height: 130px;
    margin-bottom: 6px;
  }

  .plant-stage svg{ width:100%; height:100%; overflow: visible; }

  .sway{ transform-origin: bottom center; animation: sway 4.5s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){
    .sway{ animation: none; }
    .habit-card{ animation: none; }
  }
  @keyframes sway{
    0%,100%{ transform: rotate(-1.2deg); }
    50%{ transform: rotate(1.2deg); }
  }

  .habit-name{
    font-weight: 700;
    font-size: 1.05rem;
    margin: 4px 0 2px;
    word-break: break-word;
  }

  .streak-row{
    display:flex;
    align-items:center;
    gap: 6px;
    color: var(--ink-soft);
    font-size: .9rem;
    margin-bottom: 14px;
  }

  .streak-row b{
    font-family:'JetBrains Mono', monospace;
    color: var(--moss);
    font-size: 1rem;
  }

  .habit-actions{
    display:flex;
    align-items:center;
    gap: 10px;
    width: 100%;
    justify-content:center;
  }

  .habit-check{
    border: 2px solid var(--sage);
    background: transparent;
    color: var(--moss);
    font-weight: 700;
    font-size: .92rem;
    padding: 10px 16px;
    border-radius: 30px;
    cursor: pointer;
    transition: all .18s ease;
    display:flex;
    align-items:center;
    gap:6px;
  }

  .habit-check.done{
    background: var(--sage);
    color: #fff;
  }

  .habit-check:hover{ background: var(--sage-light); border-color: var(--sage-light); color:#fff; }

  .habit-delete{
    border:none;
    background:transparent;
    color: var(--clay);
    cursor:pointer;
    padding: 8px;
    border-radius: 50%;
    line-height:0;
    opacity: .55;
    transition: opacity .15s ease, background .15s ease;
  }
  .habit-delete:hover{ opacity: 1; background: #f1e4e0; }

  .broken-tag{
    position:absolute;
    top: 14px;
    left: 14px;
    background: #f1e4e0;
    color: var(--clay);
    font-size: .72rem;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 20px;
  }

  /* ---------- Empty state ---------- */
  .empty-state{
    text-align:center;
    padding: 60px 20px;
    border: 1.5px dashed var(--line);
    border-radius: var(--radius);
    color: var(--ink-soft);
  }
  .empty-state svg{ width:96px; height:96px; margin-bottom: 10px;}
  .empty-state h3{ font-family:'Markazi Text',serif; font-size:1.8rem; color:var(--moss); margin: 6px 0 4px;}
  .empty-cta{ margin-top: 16px; }

  footer{
    text-align:center;
    color: var(--ink-soft);
    font-size: .85rem;
    margin-top: 60px;
  }

  footer a{ color: var(--moss); }
</style>
</head>
<body>

<div class="wrap">

  <header class="hero">
    <div>
      <h1 class="hero-title">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 21c0-6 4-9 8-10-1 5-3 10-8 10Z" fill="#7C9473"/><path d="M12 21c0-7-4-11-9-12 1 6 3 12 9 12Z" fill="#2F3D2C"/></svg>
        حديقة العادات
      </h1>
      <p class="hero-sub">ازرع عادة جديدة، اتابعها يوم بيوم، وشوفها بتكبر قدامك زي نبتة حقيقية.</p>
    </div>
    <div class="hero-stats">
      <div class="stat"><b id="statCount">0</b><span>عادة</span></div>
      <div class="stat"><b id="statToday">0</b><span>خلصتها النهاردة</span></div>
      <div class="stat"><b id="statBest">0</b><span>أطول سلسلة</span></div>
    </div>
  </header>

  <form class="planter" id="addForm">
    <input type="text" id="habitInput" maxlength="40" placeholder="اكتب اسم عادة جديدة… زي: اقرا ١٠ صفحات" aria-label="اسم العادة الجديدة">
    <button type="submit">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#f4f2e6" stroke-width="2.4" stroke-linecap="round"/></svg>
      ازرع عادة
    </button>
  </form>

  <div id="gardenArea"></div>

  <footer>
    صُنع بـ 🌿 — بياناتك محفوظة في متصفحك بس، مفيش سيرفر ولا حساب مطلوب.
  </footer>
</div>

<script>
(function(){
  const STORAGE_KEY = 'habitGardenData_v1';
  const form = document.getElementById('addForm');
  const input = document.getElementById('habitInput');
  const gardenArea = document.getElementById('gardenArea');
  const statCount = document.getElementById('statCount');
  const statToday = document.getElementById('statToday');
  const statBest = document.getElementById('statBest');

  function todayStr(){
    return new Date().toISOString().slice(0,10);
  }
  function yesterdayStr(){
    const d = new Date();
    d.setDate(d.getDate()-1);
    return d.toISOString().slice(0,10);
  }

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function save(habits){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
  }

  let habits = load();

  // Reconcile streak breaks on load (missed a day = streak resets, shows "broken" tag once)
  habits.forEach(h => {
    if(h.lastDate && h.lastDate !== todayStr() && h.lastDate !== yesterdayStr()){
      h.brokenFlag = h.streak > 0;
      h.streak = 0;
    }
  });
  save(habits);

  function uid(){ return 'h_' + Math.random().toString(36).slice(2,10); }

  function plantSVG(streak){
    // Growth stages by streak length
    let stage;
    if(streak <= 0) stage = 0;
    else if(streak < 3) stage = 1;
    else if(streak < 5) stage = 2;
    else if(streak < 7) stage = 3;
    else if(streak < 10) stage = 4;
    else stage = 5;

    const stems = {
      0: `<ellipse cx="60" cy="118" rx="26" ry="7" fill="#d9d4c1"/><path d="M60 118 q0 -8 0 -12" stroke="#2F3D2C" stroke-width="4" stroke-linecap="round"/><circle cx="60" cy="102" r="5" fill="#7C9473"/>`,
      1: `<ellipse cx="60" cy="118" rx="28" ry="7" fill="#d9d4c1"/><path d="M60 118 V80" stroke="#2F3D2C" stroke-width="5" stroke-linecap="round"/><path d="M60 96 q-14 -4 -18 6" stroke="#7C9473" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M60 88 q14 -4 18 4" stroke="#A9BD9D" stroke-width="5" stroke-linecap="round" fill="none"/>`,
      2: `<ellipse cx="60" cy="118" rx="30" ry="7" fill="#d9d4c1"/><path d="M60 118 V64" stroke="#2F3D2C" stroke-width="6" stroke-linecap="round"/><path d="M60 100 q-18 -6 -24 6" stroke="#7C9473" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M60 88 q18 -6 24 4" stroke="#A9BD9D" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M60 74 q-14 -8 -8 -18" stroke="#7C9473" stroke-width="5" stroke-linecap="round" fill="none"/>`,
      3: `<ellipse cx="60" cy="118" rx="32" ry="7" fill="#d9d4c1"/><path d="M60 118 V48" stroke="#2F3D2C" stroke-width="6" stroke-linecap="round"/><path d="M60 100 q-20 -6 -27 8" stroke="#7C9473" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M60 86 q20 -6 27 6" stroke="#A9BD9D" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M60 66 q-18 -8 -10 -22" stroke="#7C9473" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M60 58 q18 -8 12 -20" stroke="#A9BD9D" stroke-width="5" stroke-linecap="round" fill="none"/><circle cx="60" cy="42" r="6" fill="#E0AC3F"/>`,
      4: `<ellipse cx="60" cy="118" rx="34" ry="7" fill="#d9d4c1"/><path d="M60 118 V36" stroke="#2F3D2C" stroke-width="7" stroke-linecap="round"/><path d="M60 98 q-22 -6 -30 10" stroke="#7C9473" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M60 84 q22 -6 30 8" stroke="#A9BD9D" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M60 64 q-20 -8 -12 -24" stroke="#7C9473" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M60 54 q20 -8 14 -22" stroke="#A9BD9D" stroke-width="5" stroke-linecap="round" fill="none"/>
        <g transform="translate(60 30)">
          <circle r="7" fill="#E0AC3F"/>
          <circle cx="10" cy="-4" r="6" fill="#E9C173"/>
          <circle cx="-10" cy="-4" r="6" fill="#E9C173"/>
          <circle cx="0" cy="-11" r="6" fill="#E9C173"/>
        </g>`,
      5: `<ellipse cx="60" cy="118" rx="36" ry="7" fill="#d9d4c1"/><path d="M60 118 V30" stroke="#2F3D2C" stroke-width="7" stroke-linecap="round"/><path d="M60 96 q-24 -6 -33 12" stroke="#7C9473" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M60 80 q24 -6 33 10" stroke="#A9BD9D" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M60 60 q-22 -8 -14 -26" stroke="#7C9473" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M60 50 q22 -8 16 -24" stroke="#A9BD9D" stroke-width="6" stroke-linecap="round" fill="none"/>
        <g transform="translate(60 24)">
          <circle r="9" fill="#B3654F"/>
          <circle cx="13" cy="-5" r="8" fill="#E0AC3F"/>
          <circle cx="-13" cy="-5" r="8" fill="#E0AC3F"/>
          <circle cx="0" cy="-15" r="8" fill="#E0AC3F"/>
          <circle cx="9" cy="8" r="8" fill="#E0AC3F"/>
          <circle cx="-9" cy="8" r="8" fill="#E0AC3F"/>
        </g>`
    };
    return `<svg viewBox="0 0 120 130" class="${stage>0 ? 'sway':''}">${stems[stage]}</svg>`;
  }

  function render(){
    // stats
    statCount.textContent = habits.length;
    statToday.textContent = habits.filter(h => h.lastDate === todayStr()).length;
    statBest.textContent = habits.reduce((m,h)=> Math.max(m, h.bestStreak||0), 0);

    if(habits.length === 0){
      gardenArea.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3c0 7-4 5-4 12" stroke="#7C9473" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="12" cy="19" rx="8" ry="2" fill="#d9d4c1"/></svg>
          <h3>الحديقة لسه فاضية</h3>
          <p>اكتب أول عادة عايز تلتزم بيها فوق، وابدأ ازرعها دلوقتي.</p>
        </div>`;
      return;
    }

    gardenArea.innerHTML = `<div class="garden">${habits.map(h => {
      const doneToday = h.lastDate === todayStr();
      return `
      <div class="habit-card">
        ${h.brokenFlag ? '<span class="broken-tag">السلسلة اتقطعت</span>' : ''}
        <div class="plant-stage">${plantSVG(h.streak)}</div>
        <div class="habit-name">${escapeHtml(h.name)}</div>
        <div class="streak-row">🔥 سلسلة <b>${h.streak}</b> يوم</div>
        <div class="habit-actions">
          <button class="habit-check ${doneToday ? 'done':''}" data-id="${h.id}">
            ${doneToday ? '✓ اتعملت النهاردة' : 'تمت النهاردة'}
          </button>
          <button class="habit-delete" data-id="${h.id}" aria-label="احذف عادة ${escapeHtml(h.name)}" title="حذف">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>`;
    }).join('')}</div>`;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    const name = input.value.trim();
    if(!name) return;
    habits.unshift({
      id: uid(),
      name,
      streak: 0,
      bestStreak: 0,
      lastDate: null,
      brokenFlag: false
    });
    save(habits);
    input.value = '';
    render();
  });

  gardenArea.addEventListener('click', function(e){
    const checkBtn = e.target.closest('.habit-check');
    const delBtn = e.target.closest('.habit-delete');

    if(checkBtn){
      const id = checkBtn.dataset.id;
      const h = habits.find(x => x.id === id);
      if(!h) return;
      const today = todayStr();
      if(h.lastDate === today) return; // already done today, no-op
      if(h.lastDate === yesterdayStr()){
        h.streak += 1;
      }else{
        h.streak = 1;
      }
      h.bestStreak = Math.max(h.bestStreak||0, h.streak);
      h.lastDate = today;
      h.brokenFlag = false;
      save(habits);
      render();
    }

    if(delBtn){
      const id = delBtn.dataset.id;
      if(confirm('متأكد عايز تشيل العادة دي من الحديقة؟')){
        habits = habits.filter(x => x.id !== id);
        save(habits);
        render();
      }
    }
  });

  render();
})();
</script>
</body>
</html>
